[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-valuation"
version = "1.0.0"
description = "Monte Carlo simulation applied to the valuation of an investment project and of ASML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
